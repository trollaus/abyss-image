name: Abyss image

# The abyss image is built here and published to ghcr.io/trollaus/abyss-image;
# consumers pull a digest-pinned reference and never build on the host
# (e.g. an ansible container role). This is the gate: the build runs the Dockerfile's own checks -
# the engine tarball's `sha256sum -c` against ABYSS_ENGINE_SHA256, the PREBUILT.json commit
# check against ABYSS_COMMIT, the pip install and the py_compile - so a stale pin (a version
# moved, the companion pins stale) or a pip pin that no longer resolves fails the PR before
# the image is published, not the deploy. Triggered when the Dockerfile or this pipeline's
# own files change (the workflow especially, since it enforces everything else), so it never
# runs on unrelated PRs.
on:
  # Manual rebuild / re-publish of a tag without a commit (e.g. a redo after
  # a pinned upstream release moved).
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/abyss-image.yml
      - .github/renovate/abyss-pins.mjs
      - renovate.json
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .github/workflows/abyss-image.yml
      - .github/renovate/abyss-pins.mjs
      - renovate.json

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Syntax-check the postUpgradeTask script
        run: node --check .github/renovate/abyss-pins.mjs

      - name: Read the pins
        id: pins
        run: |
          # Tags: the release (ABYSS_VERSION, which consumers pin by digest and Renovate orders)
          # and sha-<ABYSS_COMMIT short>.
          version=$(grep -oP '^ARG ABYSS_VERSION=\K\S+' Dockerfile)
          commit=$(grep -oP '^ARG ABYSS_COMMIT=\K\S+' Dockerfile)
          echo "image=ghcr.io/trollaus/abyss-image" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(echo "${commit}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # The build is self-verifying: the tarball's sha256sum -c and the PREBUILT.json
      # commit check run inside it, so a poisoned digest or a forgotten pin fails here.
      - name: Build the abyss image
        run: docker build --pull -f Dockerfile -t "${{ steps.pins.outputs.image }}:${{ steps.pins.outputs.version }}" .

      # Publish on master: a push, or a manual run (workflow_dispatch) of master. PR builds only build.
      - name: Push the abyss image
        if: github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ steps.pins.outputs.image }}
          VERSION: ${{ steps.pins.outputs.version }}
          SHA_TAG: ${{ steps.pins.outputs.sha }}
        run: |
          for t in "$SHA_TAG" latest; do docker tag "$IMAGE:$VERSION" "$IMAGE:$t"; done
          for t in "$VERSION" "$SHA_TAG" latest; do docker push "$IMAGE:$t"; done

      # The manifest digest, from the registry (a local build has no RepoDigests yet):
      # the image line a consumer pins (e.g. a role's static docker-compose.yml).
      - name: Print the image digest
        if: github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ steps.pins.outputs.image }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | grep -m1 'sha256:' | cut -d: -f3)
          echo "image: $IMAGE:$VERSION@sha256:${digest}"
